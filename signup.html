<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-image: url(./images/1603.jpg);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 400px;
        height: 450px;
        /* background-color: bisque;*/
        background-color: rgba(209, 9, 9, 0.427);
        text-align: center;
        border-radius: 5px;
        margin: 110px auto;
        padding: 40px 50px;
      }
      .container header {
        font-size: 1.5rem;
        color: #333;
        font-weight: 500;

        margin-bottom: 30px;
      }

      form input {
        width: 100%;
        padding: 10px;
        border: 0;
        outline: 0;
        margin-bottom: 10px;
        border-radius: 4px;
      }
      input[type="submit"] {
        margin-top: 50px;
        background-color: rgb(80, 153, 231);
        width: 100px;
      }
      input[type="submit"]:hover {
        background-color: cadetblue;
        cursor: pointer;
        color: rgb(227, 68, 24);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Registeration Form</header>
      <form method="post" action="./php/signup.php">
        <input
          type="text"
          id="UsernameId"
          placeholder="username"
          required
          name="username"
        />

        <input
          type="password"
          id="PasswordId"
          placeholder="password"
          required
          name="password"
        />

        <input
          type="password"
          name=""
          id="ConfirmId"
          placeholder="confirm password"
          required
          name="confirm"
        />

        <input
          type="email"
          id="EmailId"
          placeholder="email"
          required
          name="email"
        />

        <input type="submit" value="submit" />
      </form>
    </div>
  </body>
</html>
